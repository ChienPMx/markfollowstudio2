[app]
    segment_duration = 5 # Khoảng thời gian cắt âm thanh (phút), gợi ý: 5-10
    transcribe_parallel_num = 1 # Số lượng xử lý chuyển soạn song song tối đa, gợi ý: 1-3
    translate_parallel_num = 3 # Số lượng xử lý dịch thuật song song tối đa, gợi ý: 3
    transcribe_max_attempts = 3 # Số lần thử lại tối đa cho chuyển soạn, gợi ý: 3
    translate_max_attempts = 5 # Số lần thử lại tối đa cho dịch thuật, gợi ý: 5
    max_sentence_length = 70 # Số ký tự tối đa mỗi câu, gợi ý: 50-70
    proxy = "" # Địa chỉ proxy, ví dụ: http://127.0.0.1:7890, có thể để trống

[server]
    host = "127.0.0.1"
    port = 8888

# Các cấu hình bên dưới không bắt buộc điền hết, vui lòng xem tài liệu

[llm] # Hỗ trợ openai, deepseek, qwen... tương thích OpenAI API
    base_url = "" # URL tùy chỉnh, để trống nếu dùng OpenAI chính thức
    api_key = "" # Khóa API
    model = "" # Tên mô hình, mặc định gpt-4o-mini
    json = false # LLM có hỗ trợ định dạng JSON không?

[transcribe] # Nhận dạng giọng nói (openai, fasterwhisper, whisperkit, whispercpp)
    provider = "openai"
    enable_gpu_acceleration = false # Tăng tốc GPU cho fasterwhisper
    [transcribe.openai]
        base_url = ""
        api_key = ""
        model = "whisper-1"
    [transcribe.fasterwhisper]
        model = "medium" # Mô hình local cho fasterwhisper: tiny, medium, large-v2
    [transcribe.whisperkit]
        model = "large-v2" # Mô hình local cho whisperkit: large-v2
    [transcribe.whispercpp]
        model = "large-v2" # Mô hình local cho whispercpp: large-v2

[tts] # Dịch vụ tổng hợp giọng nói (openai, edge-tts, vclip)
    provider = "openai"
    [tts.openai]
        base_url = ""
        api_key = ""
        model = "tts-1" # tts-1, tts-1-hd
        voice = "alloy" # alloy, echo, fable, onyx, nova, shimmer
    [tts.edge-tts]
        voice = "en-US-AndrewNeural" # Giọng nói mặc định cho edge-tts
    [tts.vclip] # VClip TTS - https://api-tts.vclip.io
        api_key = "" # API Key từ trang quản lý VClip
        voice_id = "" # userVoiceId từ trang Giọng nói của bạn trên VClip
        speed = 1.0 # Tốc độ đọc: 0.5 - 2.0 (mặc định 1.0)